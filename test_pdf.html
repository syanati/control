<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test PDF - Warchati</title>
    <!-- Carga de html2pdf (¡no olvides esta línea!) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Tajawal', sans-serif; padding: 20px; }
        button { padding: 15px 30px; font-size: 1.2rem; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Diagnóstico de PDF</h1>
    <button onclick="testSimplePdf()">🧪 Generar PDF de prueba</button>

    <script>
        async function testSimplePdf() {
            // Crear el elemento de forma visible (opacidad alta para debug)
            const element = document.createElement('div');
            element.style.position = 'fixed';
            element.style.top = '0';
            element.style.left = '0';
            element.style.width = '210mm';
            element.style.backgroundColor = 'white';
            element.style.color = 'black';
            element.style.padding = '10mm';
            element.style.zIndex = '99999';
            element.style.opacity = '0.9';   // bien visible
            element.style.fontFamily = 'Tajawal, sans-serif';
            element.innerHTML = `
                <h1>اختبار PDF</h1>
                <p>Este es un PDF de prueba. Si ves este texto en el PDF, la librería funciona correctamente.</p>
            `;

            document.body.appendChild(element);

            // Dar tiempo al navegador para renderizar
            await new Promise(resolve => setTimeout(resolve, 300));

            try {
                await html2pdf()
                    .set({
                        margin: 0,
                        filename: 'test.pdf',
                        html2canvas: { scale: 2, logging: true },
                        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                    })
                    .from(element)
                    .save();
                alert('PDF de prueba generado. Revisa la descarga.');
            } catch (error) {
                console.error(error);
                alert('Error al generar el PDF: ' + error.message);
            } finally {
                document.body.removeChild(element);
            }
        }
    </script>
</body>
</html>
